# Follow Up Boss MCP Server: one-click deploy on a Hostinger VPS.
#
# Set two values in Docker Manager before you deploy:
#   FUB_API_KEY        your Follow Up Boss API key (FUB: Admin > API)
#   MCP_AUTH_PASSWORD  a password you make up, 12+ characters; Claude asks for it once
#
# Caddy gets a free HTTPS certificate for your server's Hostinger address
# (srvNNNN.hstgr.cloud) on the first visit. To use your own domain instead,
# point it at the server and set DOMAIN.
#
# Then add https://<your address>/mcp to Claude as a custom connector.
# Guide: https://github.com/mindwear-capitian/followupboss-mcp-server/blob/main/deploy/hostinger/README.md

services:
  mcp:
    image: ghcr.io/mindwear-capitian/followupboss-mcp-server:2
    restart: unless-stopped
    environment:
      FUB_API_KEY: ${FUB_API_KEY:?Set FUB_API_KEY to your Follow Up Boss API key}
      MCP_AUTH_PASSWORD: ${MCP_AUTH_PASSWORD:?Set MCP_AUTH_PASSWORD to a password of 12 or more characters}
      FUB_SAFE_MODE: ${FUB_SAFE_MODE:-true}
      FUB_SYSTEM: ${FUB_SYSTEM:-}
      FUB_SYSTEM_KEY: ${FUB_SYSTEM_KEY:-}
      MCP_TRUST_PROXY: "1"
    volumes:
      - mcp-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      CADDYFILE: |
        {
        	on_demand_tls {
        		ask http://127.0.0.1:5555/allowed
        	}
        }

        # Certificates only for this server's Hostinger address or DOMAIN.
        http://127.0.0.1:5555 {
        	@ok vars_regexp {query.domain} ^(srv[0-9]+\.hstgr\.cloud|{$$DOMAIN})$$
        	respond @ok 200
        	respond 403
        }

        https:// {
        	tls {
        		on_demand
        	}
        	reverse_proxy mcp:3000
        }
    command: ["sh", "-c", "printf '%s' \"$$CADDYFILE\" > /etc/caddy/Caddyfile && exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mcp-data:
  caddy-data:
  caddy-config:
